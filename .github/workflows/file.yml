name: Download Video from Gofile

on:
  workflow_dispatch:

jobs:
  download-and-commit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download Video File
      run: |
        # Direct URL provided by the user
        VIDEO_URL="https://store-eu-par-3.gofile.io/download/web/8880e7cd-b985-4922-81cf-471d650afde0/input_video.mp4"
        OUT_FILE="input_video.mp4"
        
        echo "Downloading video file from Gofile..."
        # Using -f to make the step fail immediately if the link expires or gives a 404/503 error
        curl -fL "$VIDEO_URL" -o "$OUT_FILE"

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Track the newly downloaded mp4 file
        git add input_video.mp4
        
        # Check if the file is new or modified before attempting a commit
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update: Downloaded input_video.mp4" && git push)
