name: Download Video from StorageToBox

on:
  workflow_dispatch:

jobs:
  download-and-commit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download Video File
      run: |
        # Direct URL with signature parameters
        VIDEO_URL="https://cdn.storagetobox.com/167761b1-178c-4f61-b810-f6eff2b77ff8?expires=1791347360&filename=input_video.mp4&id=NyuwpN1D5&sig=858a4a5c3f94870859ae435b95f6fff6de7d79ef457c27f9a3b1559ecbc3aed5"
        OUT_FILE="input_video.mp4"
        
        echo "Downloading video file..."
        # -f fails the step immediately if the link expires or errors out
        curl -fL "$VIDEO_URL" -o "$OUT_FILE"

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Track the video file
        git add input_video.mp4
        
        # Only commit if the video has changed or is new
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update: Downloaded new input_video.mp4" && git push)
